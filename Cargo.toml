[package]
name = "benos-kernel-tool"
version = "0.1.0"
edition = "2021"
description = "Backport triage for ACK android12-5.10 fixes: apply, build, classify."
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "env"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "benos-kt"
path = "src/main.rs"
